services:
  la-redis:
    image: redis:7.2-alpine
    command: [
      "redis-server",
      "--appendonly", "yes",
      "--port",        "${REDIS_PORT:-6379}",
      "--requirepass", "${REDIS_PASSWORD}"
    ]
    # Expose Redis to host only if you want to inspect it locally:
    ports:
      - "${REDIS_HOST_PORT:-6379}:${REDIS_PORT:-6379}"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_DB: ${REDIS_DB:-0}
    volumes:
      - redis_data:/data
    networks: [backend-net]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} -p ${REDIS_PORT:-6379} ping | grep PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    working_dir: /backend
    init: true
    command: >
      uvicorn api.main:app
      --host 0.0.0.0
      --port ${BACKEND_PORT:-8000}
      --proxy-headers
      --reload
      --reload-dir /backend
      --reload-exclude db
    environment:
      REDIS_URL: "redis://:${REDIS_PASSWORD}@la-redis:${REDIS_PORT:-6379}/${REDIS_DB:-0}"
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-1800}
      BACKEND_PORT: ${BACKEND_PORT:-8000}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_DB: ${REDIS_DB:-0}
    volumes:
      - ./backend:/backend
      - ./db:/backend/db
    depends_on:
      la-redis:
        condition: service_healthy
    networks: [backend-net]
    ports:
      - "${BACKEND_PORT:-8000}:${BACKEND_PORT:-8000}"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:${BACKEND_PORT:-8000}/health || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 10
    restart: unless-stopped

networks:
  backend-net:
    driver: bridge

volumes:
  redis_data:
