name: Python CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop
      - feature/Setup-CI

env:
  COMPOSE: docker compose -f docker-compose.yml -f docker-compose.ci.yml

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Write CI .env
        run: |
          cat > .env <<'EOF'
          UUID_NAMESPACE="b1343753-a4f3-4be8-94c6-9780ee37ab61"
          AUTH_JWT_SECRET=test-auth-secret
          SUPABASE_JWT_SECRET=test-supabase-secret
          EOF

      - name: Start core stack
        env:
          # The Dockerfile marks the hf_token secret required=true, so BuildKit
          # needs a non-empty value present. CI skips the model pre-cache entirely
          # via SKIP_MODEL_PRECACHE=1 (docker-compose.ci.yml) — the graph is mocked
          # in tests, so the model is never used — so a dummy value is enough.
          # COMPOSE_BAKE lets compose forward build secrets/args to BuildKit.
          HF_TOKEN: "ci-skip"
          COMPOSE_BAKE: "true"
        run: |
          $COMPOSE up -d --build --wait la-qdrant la-mongo la-redis
          $COMPOSE up -d --build la-documedai

      - name: App tests
        run: |
          $COMPOSE exec -T la-documedai pytest -q \
            ci_tests/integration/utils \
            ci_tests/integration/api

      - name: Vector DB tests
        if: always()
        run: |
          $COMPOSE exec -T la-documedai pytest -q \
            ci_tests/integration/vector_db/test_qdrant_client.py

      - name: MCP tests
        if: always()
        run: |
          $COMPOSE exec -T la-documedai pytest -q \
            ci_tests/integration/tool_core \
            ci_tests/integration/mcp

      - name: Dump logs on failure
        if: failure()
        run: $COMPOSE logs --no-color

      - name: Tear down
        if: always()
        run: $COMPOSE down -v
