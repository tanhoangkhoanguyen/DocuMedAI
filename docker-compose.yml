  la-vespa:
    image: vespaengine/vespa:8.629.20
    # restart: unless-stopped
    container_name: la-vespa-service
    hostname: vespa-container
    ports:
      - "8080:8080"
      - "19071:19071"
    networks:
      - backend-net
    volumes:
      - ./backend/vector_database_tests/utils/vespa_config:/app
      - ./backend/vector_database_tests/utils/data_storage/vespa_data:/opt/vespa/var
    deploy:
      resources:
        limits:
          memory: 4g

  la-backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    env_file:
      - .env
    depends_on:
      - la-vespa
    stdin_open: true
    tty: true
    restart: always
    container_name: la-backend-service
    ports:
      - "8000:8000"
    networks:
      - backend-net
    volumes:
      - ./backend:/backend

networks:
  backend-net:
    driver: bridge