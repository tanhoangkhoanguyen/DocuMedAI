# Default: DocuMedAI app (Mongo + Redis + Qdrant + API + Next.js).
# Optional vector stores for backend/vector_database_tests benchmarks:
#   docker compose --profile vectordb-lab up -d --build

services:
  la-qdrant:
    image: qdrant/qdrant:v1.16.1
    restart: unless-stopped
    container_name: la-qdrant-service
    ports:
      - "6333:6333"
    networks:
      - documedai-net
    volumes:
      - ./backend/vector_database_tests/utils/data_storage/qdrant_data:/qdrant/storage

  la-mongo:
    image: mongo:8.0.13-noble
    restart: unless-stopped
    container_name: la-mongo-service
    ports:
      - "27017:27017"
    networks:
      - documedai-net
    volumes:
      - ./backend/services/utils/data_storage/mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  la-redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    container_name: la-redis-service
    command: redis-server --notify-keyspace-events Ex
    ports:
      - "6379:6379"
    networks:
      - documedai-net
    volumes:
      - ./backend/services/utils/data_storage/redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  la-milvus:
    profiles: ["vectordb-lab"]
    image: milvusdb/milvus:v2.3.5
    container_name: la-milvus-service
    command: milvus run standalone
    ports:
      - "19530:19530"
      - "9091:9091"
    environment:
      ETCD_USE_EMBED: "true"
      COMMON_STORAGETYPE: local
    networks:
      - documedai-net
    volumes:
      - ./backend/vector_database_tests/utils/data_storage/milvus_data:/var/lib/milvus

  la-pinecone:
    profiles: ["vectordb-lab"]
    image: ghcr.io/pinecone-io/pinecone-local:latest
    container_name: la-pinecone-service
    restart: unless-stopped
    ports:
      - "5080:5080"
      - "5081:5081"
    networks:
      - documedai-net

  la-vespa:
    profiles: ["vectordb-lab"]
    image: vespaengine/vespa:8.629.20
    restart: unless-stopped
    container_name: la-vespa-service
    hostname: vespa-container
    ports:
      - "8080:8080"
      - "19071:19071"
    networks:
      - documedai-net
    volumes:
      - ./backend/vector_database_tests/utils/vespa_config:/app
      - ./backend/vector_database_tests/utils/data_storage/vespa_data:/opt/vespa/var
    mem_limit: 8g

  la-weaviate:
    profiles: ["vectordb-lab"]
    image: semitechnologies/weaviate:1.34.8
    container_name: la-weaviate-service
    restart: unless-stopped
    ports:
      - "8083:8080"
    environment:
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: "/var/lib/weaviate"
      ENABLE_MODULES: ""
      DEFAULT_VECTORIZER_MODULE: ""
      CLUSTER_HOSTNAME: "node1"
    networks:
      - documedai-net
    volumes:
      - ./backend/vector_database_tests/utils/data_storage/weaviate_data:/var/lib/weaviate

  la-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - path: .env
    environment:
      MONGO_URL: mongodb://la-mongo:27017/
      REDIS_URL: redis://la-redis:6379/0
    depends_on:
      la-qdrant:
        condition: service_started
      la-mongo:
        condition: service_healthy
      la-redis:
        condition: service_healthy
    restart: unless-stopped
    container_name: la-backend-service
    ports:
      - "2010:2010"
    networks:
      - documedai-net
    volumes:
      - models_cache:/models
    mem_limit: 4g
    healthcheck:
      test: ["CMD", "true"]

  la-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    env_file:
      - path: .env
    environment:
      INTERNAL_API_BASE: http://la-backend:2010
    depends_on:
      la-backend:
        condition: service_healthy
    restart: unless-stopped
    container_name: la-frontend-service
    ports:
      - "2011:2011"
    networks:
      - documedai-net

networks:
  documedai-net:
    driver: bridge

volumes:
  models_cache: