# Default: DocuMedAI app (Mongo + Redis + Qdrant + API + Next.js).
# Optional vector stores for backend/vector_database_tests benchmarks:
#   docker compose --profile vectordb-lab up -d --build

services:
  la-qdrant:
    image: qdrant/qdrant:v1.18.2
    restart: unless-stopped
    container_name: la-qdrant-service
    ports:
      - "6333:6333"
    networks:
      - documedai-net
    volumes:
      - ./backend/vector_database_tests/utils/data_storage/qdrant_data:/qdrant/storage
    # Equal resource budget across all perf DBs (see la-milvus/weaviate/vespa).
    mem_limit: 8g
    cpus: 4.0

  la-mongo:
    image: mongo:8.0.13-noble
    restart: unless-stopped
    container_name: la-mongo-service
    ports:
      - "27017:27017"
    networks:
      - documedai-net
    volumes:
      - ./backend/utils/data_storage/mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 180s

  la-redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    container_name: la-redis-service
    command: redis-server --notify-keyspace-events Ex
    ports:
      - "6379:6379"
    networks:
      - documedai-net
    volumes:
      - ./backend/utils/data_storage/redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  la-llmguard:
    # LLMGuard — OpenAI-compatible gateway with an internal provider adapter:
    # rate limit, retry/backoff, circuit breaker, admission control, Prometheus
    # metrics. Clients speak the OpenAI wire format; the Vertex adapter
    # translates to Google's native generateContent API. See backend/llmguard/.
    build:
      context: ./backend/llmguard
      dockerfile: Dockerfile
    restart: unless-stopped
    container_name: la-llmguard-service
    env_file:
      - path: .env
    environment:
      # The model allowlist: which models are callable and through which upstream.
      # Required — the process exits if it is missing or invalid. Mounted below,
      # so editing it is a restart rather than a rebuild.
      LLMGUARD_CONFIG: /config.yaml
      # Same vars la-documedai reads — one .env configures both.
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT}
      GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION:-us-central1}
      # ADC: service-account key mounted read-only below. Vertex takes no API key.
      # Local only — on GCP the attached service account supplies ADC, and this
      # must be UNSET there or the gateway looks for a file that is not present.
      # GEMINI_API_KEY needs no entry here: env_file loads it already.
      GOOGLE_APPLICATION_CREDENTIALS: /secrets/gcp-sa.json
      PROXY_PORT: "8081"
      REDIS_URL: redis://la-redis:6379/1 # DB 1 — separate from the app cache on DB 0
      # Tracing is OFF unless this is set, so the default stack runs untraced and
      # depends on no collector being up. The SDK appends /v1/traces to the value.
      #   OTEL_EXPORTER_OTLP_ENDPOINT=http://la-otel-collector:4318
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-llmguard}
    depends_on:
      la-redis:
        condition: service_healthy
    ports:
      - "8081:8081"                      # expose for local /metrics + smoke tests
    networks:
      - documedai-net
    volumes:
      # Read-only: the gateway never writes its own allowlist. The image ships a
      # copy of this same file, so the service still starts if the mount is
      # removed in a deployment that bakes the config in instead.
      - ./backend/llmguard/config.yaml:/config.yaml:ro
      # Pairs with GOOGLE_APPLICATION_CREDENTIALS above: local only, and remove
      # both together on GCP. Without it the vertex provider fails to resolve
      # ADC and the gateway restart-loops instead of serving.
      - ${GOOGLE_SA_KEY_PATH:-./gcp-sa.json}:/secrets/gcp-sa.json:ro
    healthcheck:
      # distroless image has no shell/curl; use the Go binary's own probe.
      test: ["CMD", "/llmguard", "-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Proves the gateway is stateless: nginx round-robins across N replicas sharing
  # one Redis, and the rate limit still holds in aggregate.
  # Additive: every service below is profile-gated, so a plain `docker compose up`
  # renders the single-replica stack byte-identically. nginx takes 8082, not 8081.
  la-llmguard-replica:
    profiles: ["multi-replica"]
    # Same build context as la-llmguard: one image, scaled — not a copy-paste.
    build:
      context: ./backend/llmguard
      dockerfile: Dockerfile
    restart: unless-stopped
    # No container_name and no host ports, deliberately: those two keys are
    # exactly what makes la-llmguard unscalable. The public door is nginx.
    deploy:
      # Honored by Compose v2+ (not Swarm-only). Override with
      # `--scale la-llmguard-replica=3`.
      replicas: ${LLMGUARD_REPLICAS:-2}
    # Same as la-llmguard: the replicas read the same .env, so a var set for one
    # applies to both rather than only to whichever service remembered to load it.
    env_file:
      - path: .env
    environment:
      # Mock-backed allowlist, mounted below — not config.yaml, which needs ADC.
      LLMGUARD_CONFIG: /config.yaml
      PROXY_PORT: "8081"
      # DB 1 — the SAME database la-llmguard uses, which is the entire point: one
      # rate-limit bucket and one breaker flag shared by every replica.
      REDIS_URL: redis://la-redis:6379/1
      # Named by config.multi-replica.yaml. The mock ignores it, but it must be
      # non-empty: LLMGuard refuses to start on a declared-but-empty key.
      MOCK_API_KEY: ${MOCK_API_KEY:-dummy}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-llmguard}
    depends_on:
      la-redis:
        condition: service_healthy
      la-mockupstream:
        condition: service_healthy
    networks:
      - documedai-net
    volumes:
      - ./backend/llmguard/config.multi-replica.yaml:/config.yaml:ro
    healthcheck:
      # distroless has no shell/curl; the binary probes itself on 127.0.0.1.
      test: ["CMD", "/llmguard", "-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  la-nginx:
    profiles: ["multi-replica"]
    image: nginx:1.27-alpine
    restart: unless-stopped
    container_name: la-nginx-service
    ports:
      # 8082, not 8081: la-llmguard owns 8081 and this runs alongside it.
      - "8082:80"
    # All four were measured on the two-VM GCP stack and kept as-is; the template
    # carries the measurement behind each. They stay env vars rather than literals
    # so tuning is a restart, not an edit — and so .env can hold whatever a given
    # machine turned out to need.
    environment:
      # This template is a WHOLE config, not a server block, so it must render to
      # nginx.conf itself. The default output dir is conf.d/, which is included from
      # inside `http` — where worker_processes is illegal and nginx refuses to boot.
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx
      # Pinned at 1 because `keepalive` and `worker_connections` are PER WORKER and
      # nginx's default is one worker per CPU: on an 8-core host the pool below
      # would really be 8x. One worker makes both numbers mean what they say.
      NGINX_WORKER_PROCESSES: ${NGINX_WORKER_PROCESSES:-1}
      NGINX_WORKER_CONNECTIONS: ${NGINX_WORKER_CONNECTIONS:-1024}
      NGINX_KEEPALIVE: ${NGINX_KEEPALIVE:-32}
      NGINX_MAX_FAILS: ${NGINX_MAX_FAILS:-3}
      # nginx's own default, and shorter than CIRCUIT_OPEN_FOR (20s) without
      # conflict: a tripped breaker answers 503, and 503 is not in the default
      # proxy_next_upstream set, so nginx never ejects a replica for it. Measured;
      # see the template.
      NGINX_FAIL_TIMEOUT: ${NGINX_FAIL_TIMEOUT:-10s}
    networks:
      - documedai-net
    volumes:
      # A template, not a conf: the image runs envsubst over /etc/nginx/templates at
      # startup and writes the result to /etc/nginx/nginx.conf. Read-only — nginx
      # renders to a different path and never writes here.
      - ./backend/llmguard/nginx/nginx.conf.template:/etc/nginx/templates/nginx.conf.template:ro
    depends_on:
      la-llmguard-replica:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  la-mockupstream:
    profiles: ["multi-replica"]
    # Context is the module root, not mockupstream/: the package needs
    # go.mod/go.sum. See mockupstream/Dockerfile.
    build:
      context: ./backend/llmguard
      dockerfile: mockupstream/Dockerfile
    restart: unless-stopped
    container_name: la-mockupstream-service
    environment:
      # A visible pause between SSE frames. Without it, "streamed" and "buffered
      # into one blob" look identical, making proxy_buffering unverifiable.
      MOCK_CHUNK_DELAY: ${MOCK_CHUNK_DELAY:-120ms}
      MOCK_COMPLETION_TOKENS: ${MOCK_COMPLETION_TOKENS:-24}
      # Benchmark knobs, all defaulting to the mock's own defaults (unset ==
      # absent). Scenario A needs MOCK_LATENCY to stand in for a real model's
      # seconds-long reply: at the mock's native ~1ms, MAX_IN_FLIGHT is
      # unreachable at any QPS a driver can offer. Scenario D uses the error
      # knobs to drive the breaker from both sides of CircuitFailRatio.
      MOCK_LATENCY: ${MOCK_LATENCY:-}
      MOCK_JITTER: ${MOCK_JITTER:-}
      MOCK_ERROR_RATE: ${MOCK_ERROR_RATE:-}
      MOCK_ERROR_STATUS: ${MOCK_ERROR_STATUS:-}
    # No host port: replicas reach it as la-mockupstream:8090 via compose DNS.
    networks:
      - documedai-net
    # The image ships its own HEALTHCHECK (the binary self-probing).

  la-milvus:
    profiles: ["vectordb-lab"]
    image: milvusdb/milvus:v2.6.18
    container_name: la-milvus-service
    command: milvus run standalone
    ports:
      - "19530:19530"
      - "9091:9091"
    environment:
      ETCD_USE_EMBED: "true"
      ETCD_DATA_DIR: /var/lib/milvus/etcd
      ETCD_CONFIG_PATH: /milvus/configs/advanced/etcd.yaml
      COMMON_STORAGETYPE: local
      DEPLOY_MODE: STANDALONE
      MILVUS_STREAMING_SERVICE_ENABLED: "false"
      COMMON_STORAGE_ENABLEV2: "false"
    networks:
      - documedai-net
    volumes:
      - ./backend/vector_database_tests/utils/data_storage/milvus_data:/var/lib/milvus
    mem_limit: 8g
    cpus: 4.0

  la-vespa:
    profiles: ["vectordb-lab"]
    image: vespaengine/vespa:8.709.19
    restart: unless-stopped
    container_name: la-vespa-service
    hostname: vespa-container
    ports:
      - "8080:8080"
      - "19071:19071"
    networks:
      - documedai-net
    volumes:
      - ./backend/vector_database_tests/utils/vespa_config:/app
      - ./backend/vector_database_tests/utils/data_storage/vespa_data:/opt/vespa/var
    mem_limit: 8g
    cpus: 4.0
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:19071/state/v1/health"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 360s

  la-weaviate:
    profiles: ["vectordb-lab"]
    image: semitechnologies/weaviate:1.37.9
    container_name: la-weaviate-service
    restart: unless-stopped
    ports:
      - "8083:8080"
    environment:
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: "/var/lib/weaviate"
      ENABLE_MODULES: ""
      DEFAULT_VECTORIZER_MODULE: ""
      CLUSTER_HOSTNAME: "node1"
    networks:
      - documedai-net
    volumes:
      - ./backend/vector_database_tests/utils/data_storage/weaviate_data:/var/lib/weaviate
    mem_limit: 8g
    cpus: 4.0

  la-chroma:
    profiles: ["vectordb-lab"]
    image: chromadb/chroma:1.5.9
    container_name: la-chroma-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    networks:
      - documedai-net
    volumes:
      - ./backend/vector_database_tests/utils/data_storage/chroma_data:/data
    mem_limit: 8g
    cpus: 4.0

  la-documedai:
    build:
      context: ./backend
      dockerfile: Dockerfile
      # (Required) authenticates the HF model pre-cache download. Build fails if
      # HF_TOKEN is unset/empty. Set it in .env or the shell env.
      secrets:
        - hf_token
    image: documedai
    env_file:
      - path: .env
    environment:
      MONGO_URL: mongodb://la-mongo:27017/
      REDIS_URL: redis://la-redis:6379/0
      QDRANT_URL: http://la-qdrant:6333
      # Chat-completion calls run on Google Vertex AI.
      # Read by services.chatbot.tools.llm_config; also consumed by LiteLLM (CrewAI).
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT}
      GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION:-us-central1}
      # ADC: service-account key mounted read-only below.
      # GOOGLE_APPLICATION_CREDENTIALS: /secrets/gcp-sa.json            # Vertex AI ADC. Comment out in deployment
      # TopicChecker's summarisation goes through LLMGuard, which fronts Vertex
      # with retry, circuit breaking and the rate limit. Both are REQUIRED and
      # must be non-empty: absent or blank fails at startup rather than guessing
      # an upstream path, and there is no runtime fallback to a direct client.
      LLM_GATEWAY_URL: ${LLM_GATEWAY_URL:?set to LLMGuard base URL, e.g. http://la-llmguard:8081}
      LLM_GATEWAY_PROVIDER: ${LLM_GATEWAY_PROVIDER:?names the upstream in LLMGuard config.yaml, e.g. vertex}
    depends_on:
      la-qdrant:
        condition: service_started
      la-mongo:
        condition: service_healthy
      la-redis:
        condition: service_healthy
    restart: unless-stopped
    container_name: la-documedai-service
    ports:
      - "2010:2010"
    networks:
      - documedai-net
    volumes:
      - ./backend:/backend            # live source → uvicorn reload + logs to host ./backend/logs
      - models_cache:/models
      # - ${GOOGLE_SA_KEY_PATH:-./gcp-sa.json}:/secrets/gcp-sa.json:ro  # Vertex AI ADC. Comment out in deployment
    mem_limit: 8g                     # ground_truth (faiss exact-kNN over 1M vectors)
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:2010/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 180s

  la-mcp-server:
    # DocuMedAI's Tool Core exposed over real MCP (JSON-RPC 2.0, streamable-HTTP) for
    # external MCP hosts (Claude Desktop, MCP Inspector). Same code + image as la-documedai,
    # different command (skips entrypoint.sh; serves /mcp instead of the FastAPI app).
    # The app does NOT depend on this — la-documedai runs identically whether it is up or
    # not. See backend/mcp_server/.
    build:
      context: ./backend
      dockerfile: Dockerfile
      secrets:
        - hf_token
    image: documedai                  # reuse the la-documedai image (built once, shared tag)
    command: ["python", "-m", "mcp_server", "--host", "0.0.0.0", "--port", "8090"]
    env_file:
      - path: .env                     # JWT secrets (auth) + LLM proxy config
    environment:
      MONGO_URL: mongodb://la-mongo:27017/
      REDIS_URL: redis://la-redis:6379/0
      QDRANT_URL: http://la-qdrant:6333
    restart: unless-stopped
    container_name: la-mcp-server-service
    volumes:
      - ./backend:/backend            # app code — the image bakes only deps + entrypoint
    ports:
      - "8090:8090"                    # streamable-HTTP MCP surface at /mcp
    networks:
      - documedai-net
    mem_limit: 8g                      # loads the reranker + embedding model like la-documedai
    healthcheck:
      # TCP liveness only: a bare GET to /mcp has no spec-defined status (the streamable-HTTP
      # manager wants an event-stream Accept + session), so probe that the port is listening.
      test: ["CMD", "python", "-c", "import socket,sys; s=socket.create_connection(('127.0.0.1',8090),3); s.close()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  la-prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v3.1.0
    restart: unless-stopped
    container_name: la-prometheus-service
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    volumes:
      - ./backend/mcp_server/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # Alert rules live with the service they describe, not with the scrape
      # config, so editing LLMGuard's alerts does not touch the MCP server's.
      - ./backend/llmguard/observability/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "9090:9090"
    networks:
      - documedai-net

  la-clickhouse:
    profiles: ["observability"]
    # Trace store. Columnar, so a span table stays cheap to scan and quantiles are
    # computed exactly instead of interpolated from histogram buckets.
    image: clickhouse/clickhouse-server:24.8-alpine
    restart: unless-stopped
    container_name: la-clickhouse-service
    # Deliberately no environment block. Any CLICKHOUSE_* var makes the entrypoint
    # boot a temporary server to apply it, and that one holds every port so the
    # real process never listens. The collector creates the database and schema
    # itself (create_schema in otel-collector.yaml).
    ulimits:
      # ClickHouse opens a file per column part and fails on the default 1024.
      nofile: { soft: 262144, hard: 262144 }
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./backend/llmguard/observability/clickhouse-user.xml:/etc/clickhouse-server/users.d/otel.xml:ro
      - ./backend/llmguard/observability/clickhouse-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "8123:8123" # HTTP — what `curl`/`clickhouse-client --port 8123` uses
    healthcheck:
      # 127.0.0.1, not localhost: the server binds IPv4 only, and localhost
      # resolves to ::1 first inside the container.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - documedai-net

  la-otel-collector:
    profiles: ["observability"]
    # Sits between the gateway and ClickHouse so the Go code stays storage-agnostic:
    # it exports OTLP and never names a backend. Swapping stores is a config change.
    image: otel/opentelemetry-collector-contrib:0.115.1
    restart: unless-stopped
    container_name: la-otel-collector-service
    command: ["--config=/etc/otel-collector.yaml"]
    volumes:
      - ./backend/llmguard/observability/otel-collector.yaml:/etc/otel-collector.yaml:ro
    ports:
      - "4318:4318" # OTLP/HTTP - what OTEL_EXPORTER_OTLP_ENDPOINT points at
    depends_on:
      la-clickhouse:
        condition: service_healthy
    networks:
      - documedai-net

  la-grafana:
    profiles: ["observability"]
    image: grafana/grafana:11.4.0
    restart: unless-stopped
    container_name: la-grafana-service
    environment:
      # Local demo dashboard — anonymous viewer, no login wall.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_SECURITY_ALLOW_EMBEDDING: "true"
    volumes:
      - ./backend/mcp_server/grafana/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
      - ./backend/mcp_server/grafana/dashboard-provider.yml:/etc/grafana/provisioning/dashboards/provider.yml:ro
      - ./backend/mcp_server/grafana_dashboard.json:/var/lib/grafana/dashboards/mcp.json:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - la-prometheus
    networks:
      - documedai-net

  la-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    volumes:
      - ./frontend:/app               # live source → hot-reload
      - /app/node_modules             # keep image node_modules (Linux binaries)
      - /app/.next                    # keep dev cache in container (avoids stale host .next)
    env_file:
      - path: .env
    environment:
      INTERNAL_API_BASE: http://la-documedai:2010    # containers must use service hostname, not localhost (cant load from .env)
      # Docker Desktop on Windows/macOS: inotify events often miss bind-mount writes
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "1000"
    depends_on:
      la-documedai:
        condition: service_healthy
    restart: unless-stopped
    container_name: la-frontend-service
    ports:
      - "2011:2011"
    networks:
      - documedai-net

networks:
  documedai-net:
    driver: bridge

volumes:
  models_cache:
  clickhouse_data:
  grafana_data:

secrets:
  # Sourced from the HF_TOKEN env var. Required by the la-documedai build — set it
  # in .env or the shell env, else the backend image build fails.
  hf_token:
    environment: HF_TOKEN