services:
  la-milvus:
    image: milvusdb/milvus:v2.3.5
    container_name: la-milvus-service
    command: milvus run standalone
    ports:
      - "19530:19530"
      - "9091:9091"
    environment:
      ETCD_USE_EMBED: "true"
      COMMON_STORAGETYPE: local
    networks:
      - backend-net
    volumes:
      - ./backend/vector_database_tests/utils/data_storage/milvus_data:/var/lib/milvus

  la-pinecone:
    image: ghcr.io/pinecone-io/pinecone-local:latest
    container_name: la-pinecone-service
    restart: unless-stopped
    ports:
      - "5080:5080"
      - "5081:5081"
    networks:
      - backend-net

  la-qdrant:
    image: qdrant/qdrant:v1.16.1
    restart: unless-stopped
    container_name: la-qdrant-service
    ports:
      - "6333:6333"
    networks:
      - backend-net
    volumes:
      - ./backend/vector_database_tests/utils/data_storage/qdrant_data:/qdrant/storage

  la-vespa:
    image: vespaengine/vespa:8.629.20
    restart: unless-stopped
    container_name: la-vespa-service
    hostname: vespa-container
    ports:
      - "8080:8080"
      - "19071:19071"
    networks:
      - backend-net
    volumes:
      - ./backend/vector_database_tests/utils/vespa_config:/app
      - ./backend/vector_database_tests/utils/data_storage/vespa_data:/opt/vespa/var
    deploy:
      resources:
        limits:
          memory: 100g

  la-weaviate:
    image: semitechnologies/weaviate:1.34.8
    container_name: la-weaviate-service
    restart: unless-stopped
    ports:
      - "8083:8080"
    environment:
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: "/var/lib/weaviate"
      ENABLE_MODULES: ""
      DEFAULT_VECTORIZER_MODULE: ""
      CLUSTER_HOSTNAME: "node1"
    networks:
      - backend-net
    volumes:
      - ./backend/vector_database_tests/utils/data_storage/weaviate_data:/var/lib/weaviate

  la-mongo:
    image: mongo:8.0.13-noble
    restart: unless-stopped
    container_name: la-mongo-service
    ports:
      - "8006:27017"
    networks:
      - backend-net
    volumes:
      - ./backend/vector_database_tests/utils/data_storage/mongo_data:/data/db

  la-redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    container_name: la-redis-service
    command: redis-server --notify-keyspace-events Ex
    ports:
      - "8007:6379"
    networks:
      - backend-net
    volumes:
      - ./backend/vector_database_tests/utils/data_storage/redis_data:/data

  la-backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    env_file:
      - .env
    depends_on:
      - la-vespa
      - la-qdrant
      - la-milvus
      - la-pinecone
      - la-weaviate
      - la-mongo
      - la-redis
    stdin_open: true
    tty: true
    restart: always
    container_name: la-backend-service
    ports:
      - "2010:2010"
    networks:
      - backend-net
    volumes:
      - ./backend:/backend

  la-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    container_name: la-frontend-service
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      INTERNAL_API_BASE: http://la-backend:2010
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    depends_on:
      - la-backend
    networks:
      - backend-net

networks:
  backend-net:
    driver: bridge