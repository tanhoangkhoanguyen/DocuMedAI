services:
  la-qdrant:
    image: qdrant/qdrant:v1.16.1
    restart: unless-stopped
    container_name: la-qdrant-service
    ports:
      - "8001:6333"
    networks:
      - backend-net
    volumes:
      - ./qdrant_data:/qdrant/storage

  la-elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.10
    restart: unless-stopped
    container_name: la-eslaticsearch-service
    ports:
      - "8002:9200"
    networks:
      - backend-net
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms256m -Xmx256m
    volumes:
      - ./elasticsearch_data:/usr/share/elasticsearch/data

  la-mongodb:
    image: mongo:8.0.13-noble
    restart: unless-stopped
    container_name: la-mongodb-service
    ports:
      - "8003:27017"
    networks:
      - backend-net
    volumes:
      - ./mongodb_data:/data/db

  la-redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    container_name: la-redis-service
    ports:
      - "8004:6379"
    networks:
      - backend-net
    volumes:
      - ./redis_data:/data

  la-backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    depends_on:
      - la-qdrant
      - la-elasticsearch
      - la-mongodb
    stdin_open: true
    tty: true
    restart: always
    command: python -m services.chatbot.core.main
    container_name: la-backend-service
    ports:
      - "8005:8005"
    networks:
      - backend-net
    volumes:
      - ./backend:/backend

networks:
  backend-net:
    driver: bridge