services:
  # GitHub-hosted runners have 2 CPUs; the base compose pins cpus: 4.0 (local benchmark
  # fairness). The backend CI job starts la-qdrant, so cap it to a runner-legal budget.
  la-qdrant:
    cpus: 2.0

  la-backend:
    build:
      args:
        # Skip the HF model pre-cache in CI (graph is mocked; model never used).
        SKIP_MODEL_PRECACHE: "1"
    working_dir: /workspace
    environment:
      PYTHONPATH: /workspace/backend:/workspace
    volumes:
      - ./:/workspace
    command: ["sleep", "infinity"]
    healthcheck:
      disable: true

  # Inject a dummy upstream key so the proxy boots and passes its self-healthcheck.
  # It's never called, so the value is irrelevant.
  la-llm-proxy:
    environment:
      UPSTREAM_API_KEY: ci-dummy-key
